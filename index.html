<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="HIA — bientôt.">
  <title>HIA</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg:#f8f7f3;
      --ink:#0d0d0d;
      --muted:#716d67;
    }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; background:var(--bg); color:var(--ink); }
    body {
      min-height:100svh;
      font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      display:grid;
      place-items:center;
    }
    main {
      width:min(920px,92vw);
      min-height:100svh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:48px 20px 50px;
      text-align:center;
    }
    .logo {
      position:relative;
      width:min(430px,76vw);
      aspect-ratio:503 / 583;
      margin-bottom:38px;
    }
    .logo img {
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:contain;
      user-select:none;
      pointer-events:none;
    }
    .wing-left {
      transform-origin:50% 42%;
      animation:wingLeft 4.8s ease-in-out infinite;
    }
    .wing-right {
      transform-origin:50% 42%;
      animation:wingRight 4.8s ease-in-out infinite;
    }
    @keyframes wingLeft {
      0%,18%,100% { transform:perspective(600px) rotateY(0deg); }
      7% { transform:perspective(600px) rotateY(13deg); }
      11% { transform:perspective(600px) rotateY(4deg); }
    }
    @keyframes wingRight {
      0%,18%,100% { transform:perspective(600px) rotateY(0deg); }
      7% { transform:perspective(600px) rotateY(-13deg); }
      11% { transform:perspective(600px) rotateY(-4deg); }
    }
    .eyebrow {
      margin:0 0 13px;
      font-size:12px;
      letter-spacing:.24em;
      text-transform:uppercase;
      color:var(--muted);
    }
    h1 {
      margin:0;
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(28px,4vw,42px);
      font-weight:400;
      letter-spacing:.035em;
    }
    p {
      max-width:520px;
      margin:17px auto 0;
      color:var(--muted);
      font-size:15px;
      line-height:1.7;
    }
    .contact {
      display:inline-flex;
      margin-top:30px;
      padding:13px 21px;
      border:1px solid var(--ink);
      border-radius:999px;
      color:var(--ink);
      text-decoration:none;
      font-size:13px;
      letter-spacing:.05em;
      transition:.2s ease;
    }
    .contact:hover { background:var(--ink); color:var(--bg); }
    footer {
      position:fixed;
      bottom:18px;
      font-size:11px;
      color:#9b9790;
    }
    @media (prefers-reduced-motion:reduce) {
      .wing-left,.wing-right { animation:none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-label="Logo HIA">
      <img src="logo-base.png" alt="">
      <img class="wing-left" src="butterfly-left.png" alt="">
      <img class="wing-right" src="butterfly-right.png" alt="">
    </div>

    <p class="eyebrow">Prochainement</p>
    <h1>Une nouvelle expérience du soin corporel.</h1>
    <p>Notre univers se prépare. Retrouvez bientôt HIA et ses premières créations.</p>
    <a class="contact" href="mailto:contact@hiabynevecosmetics.com">Nous contacter</a>
  </main>
  <footer>© HIA</footer>
</body>
</html>
